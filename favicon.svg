<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Chip Shape -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="#08233b" />
  
  <!-- Outer Glow Accent -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="#0b6ac7" stroke-width="2" opacity="0.4" />
  
  <!-- Stylized 'H' & Circuit Microchip -->
  <g fill="#0b6ac7">
    <!-- Left Stem of H -->
    <path d="M 22 25 L 34 25 L 34 75 L 22 75 Z" />
    
    <!-- Right Stem of H -->
    <path d="M 66 25 L 78 25 L 78 75 L 66 75 Z" />
    
    <!-- Center Connection Bridge -->
    <rect x="34" y="44" width="10" height="12" />
    
    <!-- Central Semiconductor Microchip -->
    <rect x="44" y="38" width="22" height="24" rx="3" />
    <!-- Center Diamond Core -->
    <polygon points="55,43 60,50 55,57 50,50" fill="#08233b" />
    
    <!-- Circuit Pins / Trace Lines -->
    <rect x="48" y="34" width="3" height="4" />
    <rect x="54" y="34" width="3" height="4" />
    <rect x="60" y="34" width="3" height="4" />
    
    <rect x="48" y="62" width="3" height="4" />
    <rect x="54" y="62" width="3" height="4" />
    <rect x="60" y="62" width="3" height="4" />
    
    <!-- Circuit Trace Points on Left Stem -->
    <circle cx="28" cy="40" r="2.5" fill="#08233b" />
    <circle cx="28" cy="60" r="2.5" fill="#08233b" />
    <path d="M 28 40 L 34 40 M 28 60 L 34 60" stroke="#08233b" stroke-width="2" />
  </g>
</svg>