runtime: php82

handlers:
- url: /
  static_files: index.html
  upload: index.html
  secure: always

- url: /(.+)/
  static_files: \1/index.html
  upload: (.+)/index.html
  secure: always

- url: /(.*\.(html|gif|png|jpg|jpeg|svg|css|js|ico|woff|woff2|ttf|pdf|webp))$
  static_files: \1
  upload: (.*\.(html|gif|png|jpg|jpeg|svg|css|js|ico|woff|woff2|ttf|pdf|webp))$
  secure: always

- url: /(.*)
  static_files: index.html
  upload: index.html
  secure: always
